<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Tidak Ada Koneksi</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Poppins",sans-serif;
}

body{

background:#07111f;

background:
radial-gradient(circle at top,#12345c 0%,#07111f 65%);

height:100vh;

display:flex;

align-items:center;

justify-content:center;

overflow:hidden;

color:#fff;

}

.blur{

position:absolute;

width:260px;

height:260px;

border-radius:50%;

filter:blur(100px);

opacity:.45;

}

.blur:nth-child(1){

background:#2563eb;

top:-80px;

left:-80px;

}

.blur:nth-child(2){

background:#00d4ff;

bottom:-100px;

right:-100px;

}

.card{

position:relative;

width:92%;

max-width:380px;

padding:35px;

border-radius:24px;

background:rgba(255,255,255,.06);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.08);

text-align:center;

z-index:5;

}

.icon{

width:90px;

height:90px;

margin:auto;

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

font-size:42px;

background:rgba(37,99,235,.18);

box-shadow:
0 0 40px rgba(37,99,235,.35);

margin-bottom:20px;

}

h1{

font-size:26px;

margin-bottom:12px;

}

p{

opacity:.75;

line-height:1.7;

font-size:14px;

margin-bottom:25px;

}

button{

border:none;

cursor:pointer;

padding:14px 28px;

border-radius:14px;

background:linear-gradient(135deg,#2563eb,#00b7ff);

color:#fff;

font-size:15px;

font-weight:600;

transition:.25s;

}

button:hover{

transform:translateY(-2px);

box-shadow:0 10px 25px rgba(37,99,235,.35);

}

.version{

margin-top:20px;

font-size:12px;

opacity:.45;

}

</style>

</head>

<body>

<div class="blur"></div>
<div class="blur"></div>

<div class="card">

<div class="icon">

📡

</div>

<h1>

Tidak Ada Koneksi

</h1>

<p>

Aplikasi tidak dapat terhubung ke internet.

Periksa jaringan Anda kemudian coba lagi.

</p>

<button onclick="location.reload()">

Coba Lagi

</button>

<div class="version">

PxxStudix Dashboard

</div>

</div>

</body>

</html>
